<style>
  :root {
    --bg: #02030a;
    --text: #e8f6ff;
    --muted: #7d93a8;
    --cyan: #5ef2ff;
    --accent: #5ef2ff;               /* colour of the tuned station's category */
    --panel: rgba(6, 12, 24, 0.72);
    --line: rgba(94, 242, 255, 0.25);

    /* shared easing tokens */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-tap-highlight-color: transparent;  /* no grey flash on tap */
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;                 /* no pull-to-refresh while spinning the globe */
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  body { height: 100dvh; }

  /* the globe is a control surface: owns every touch axis, no selection, no long-press callout */
  #globe {
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }

  /* analogue static + scan lines over everything.
     No mix-blend-mode: the noise is drawn as white with varying alpha, which
     looks identical to grey noise in "screen" mode but blends far more cheaply. */
  #static {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: 0;
    image-rendering: pixelated;
  }
  #scan {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }

  /* the tuning crosshair — only transform/opacity change per frame */
  #cross {
    position: fixed; left: 50%; top: 50%;
    width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border: 1.5px solid var(--accent); border-radius: 50%;
    pointer-events: none; opacity: .85;
    transition: border-color 200ms ease;
    will-change: transform;
  }
  #cross i { position: absolute; background: var(--accent); transition: background-color 200ms ease; }
  #cross i:nth-of-type(1) { left: 50%; top: -16px; width: 1px; height: 14px; }
  #cross i:nth-of-type(2) { left: 50%; bottom: -16px; width: 1px; height: 14px; }
  #cross i:nth-of-type(3) { top: 50%; left: -16px; height: 1px; width: 14px; }
  #cross i:nth-of-type(4) { top: 50%; right: -16px; height: 1px; width: 14px; }
  #cross .halo {
    position: absolute; inset: -2px; border-radius: 50%;
    box-shadow:
      0 0 40px 10px color-mix(in srgb, var(--accent) 65%, transparent),
      inset 0 0 18px color-mix(in srgb, var(--accent) 50%, transparent);
    opacity: .15; will-change: opacity;
  }

  /* station beacon (positioned by the globe; children animate) */
  .beacon { position: relative; width: 14px; height: 14px; pointer-events: none; }
  .beacon .b-inner, .beacon .b-dot, .beacon .b-halo { position: absolute; inset: 0; border-radius: 50%; }
  .beacon .b-dot { background: var(--accent); }
  .beacon .b-halo {
    box-shadow: 0 0 40px 14px color-mix(in srgb, var(--accent) 80%, transparent);
    opacity: .45; will-change: opacity;
  }

  /* top bar */
  #top {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: calc(16px + env(safe-area-inset-left, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    display: flex; gap: 8px; align-items: center;
    pointer-events: none;
  }
  /* wordmark: plain Geist Mono, no caps or wide tracking */
  #top h1 {
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap;
    color: var(--cyan); margin-right: auto; text-shadow: 0 0 10px rgba(94,242,255,.35);
    -webkit-user-select: none; user-select: none;
  }

  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .ic { flex: none; width: 14px; height: 14px; display: block; }

  /* genre trigger */
  #genreBtn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 200px; }
  #genreBtn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #genreBtn .chev { width: 10px; height: 10px; transition: transform 180ms var(--ease-out); }
  #genreBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* genre menu — grows out of its trigger, exits faster than it enters */
  #genreMenu {
    position: fixed; z-index: 5; width: 232px;
    max-height: calc(100dvh - var(--menu-top, 64px) - 16px - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; overscroll-behavior: contain;
    padding: 6px;
    background: rgba(6, 12, 24, 0.9); border: 1px solid var(--line); border-radius: 14px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    transform-origin: var(--origin, top left);
    visibility: hidden; opacity: 0; transform: scale(0.95);
    transition:
      opacity 120ms var(--ease-out),
      transform 120ms var(--ease-out),
      visibility 0s linear 120ms;
  }
  #genreMenu.open {
    visibility: visible; opacity: 1; transform: none;
    transition:
      opacity 180ms var(--ease-out),
      transform 180ms var(--ease-out),
      visibility 0s;
  }
  #genreMenu.instant { transition: none; }   /* opened from the keyboard: no animation */
  #genreMenu hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 4px 6px; }

  #genreMenu .item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 0; border-radius: 8px;
    background: transparent;
    text-align: left; letter-spacing: .04em;
    transition: background-color 120ms ease;
  }
  #genreMenu .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #genreMenu .item small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #genreMenu .item .check { width: 12px; height: 12px; color: var(--c); opacity: 0; }
  #genreMenu .item[aria-checked="true"] .check { opacity: 1; }
  #genreMenu .item:active:not(:disabled) { transform: none; background: rgba(255,255,255,.1); }
  #genreMenu .item:focus-visible { outline: none; background: rgba(255,255,255,.08); }
  @media (hover: hover) and (pointer: fine) {
    #genreMenu .item:hover { background: rgba(255,255,255,.06); }
  }

  /* buttons — a slightly more solid fill instead of a backdrop blur: a blur behind
     each pill had to be recomputed every frame the globe or static moved */
  button {
    --c: var(--cyan);
    pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 12px; letter-spacing: .08em;
    color: var(--text); background: rgba(6, 12, 24, 0.86);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition:
      transform 160ms var(--ease-out),
      background-color 150ms ease,
      border-color 150ms ease;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button.active {
    background: color-mix(in srgb, var(--c) 20%, rgba(6, 12, 24, 0.86));
    border-color: var(--c);
  }
  @media (hover: hover) and (pointer: fine) {
    button:not(:disabled):hover { border-color: var(--c); }
  }

  button:focus-visible { outline: 1.5px solid var(--c); outline-offset: 2px; }

  #mute, #random { display: inline-flex; align-items: center; gap: 6px; }
  #mute .off, #mute.active .on { display: none; }
  #mute.active .off { display: block; }
  #mute.active { --c: #ff5e6c; }

  /* phones: icon-only Mute/Random so title + genre + controls fit one row,
     sized up to a comfortable ~44px thumb target */
  @media (max-width: 560px) {
    #top { gap: 6px; }
    #top h1 { font-size: 15px; }
    #top button { min-height: 44px; font-size: 13px; }
    #mute .label, #random .label {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    #mute, #random { min-width: 44px; padding: 0 12px; justify-content: center; }
    #mute .ic, #random .ic { width: 18px; height: 18px; }
    #genreBtn { max-width: 140px; padding: 0 14px; }
    #genreBtn .dot { width: 8px; height: 8px; }
    #genreBtn .chev { width: 12px; height: 12px; }
  }

  /* station readout */
  #panel {
    position: fixed; left: 0; right: 0; margin-inline: auto;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px)); /* room for the footer below */
    width: min(520px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  /* footer: credit on the left, coffee link on the right, lined up with the panel.
     The row itself lets drags through to the globe; only the link catches taps. */
  #footer {
    position: fixed; left: 0; right: 0; margin-inline: auto;
    bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    width: min(520px, calc(100% - 32px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 11px; color: var(--muted); pointer-events: none;
  }
  #footer .credit {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 0;               /* room so the link underline isn't clipped */
    -webkit-user-select: none; user-select: none;
  }
  #footer .heart { display: inline-block; width: 11px; height: 11px; color: #ff5e6c; vertical-align: -1px; margin: 0 1px; }
  #footer a {
    flex: none; pointer-events: auto;
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 2px;
    color: var(--cyan); text-decoration: none; letter-spacing: .02em;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition: color 150ms ease, transform 160ms var(--ease-out);
  }
  #footer a .ic { width: 14px; height: 14px; }
  /* the name reads as part of the sentence: soft text colour, faint underline */
  #footer a.author {
    display: inline; min-height: 0; padding: 6px 0; flex: initial;
    color: #c6d4e1; letter-spacing: inherit;
    text-decoration: underline; text-decoration-color: rgba(198, 212, 225, .35);
    text-underline-offset: 3px;
    transition: color 150ms ease, text-decoration-color 150ms ease;
  }
  #footer a.author:active { transform: none; color: var(--cyan); }
  #footer a:active { transform: scale(0.97); }
  #footer a:focus-visible { outline: 1.5px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
  @media (hover: hover) and (pointer: fine) {
    #footer a:hover { color: #8ff6ff; }
    #footer a.author:hover { color: var(--cyan); text-decoration-color: currentColor; }
  }
  /* the smallest phones: tighten so the credit isn't cut off */
  @media (max-width: 359px) {
    #footer { font-size: 10px; gap: 8px; }
    #footer a:not(.author) { letter-spacing: 0; gap: 4px; }
    #footer a .ic { width: 12px; height: 12px; }

  #status { font-size: 11px; line-height: 16px; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); }
  #status .s-main { display: inline-block; }

  /* connecting: three dots fill in one by one, in hard steps like an old LCD */
  #status .s-dots { display: inline-block; letter-spacing: .1em; margin-left: .1em; }
  #status .s-dots i { font-style: normal; opacity: .15; animation: 1.4s step-end infinite; }
  #status .s-dots i:nth-child(1) { animation-name: dot1; }
  #status .s-dots i:nth-child(2) { animation-name: dot2; }
  #status .s-dots i:nth-child(3) { animation-name: dot3; }
  @keyframes dot1 { 0% { opacity: .15 } 25%, 100% { opacity: 1 } }
  @keyframes dot2 { 0% { opacity: .15 } 50%, 100% { opacity: 1 } }
  @keyframes dot3 { 0% { opacity: .15 } 75%, 100% { opacity: 1 } }

  /* connected: title case, primary cyan, a touch of glow */
  #status[data-kind="live"] { text-transform: none; letter-spacing: .06em; font-size: 12px; }
  #status[data-kind="live"] .s-main {
    color: var(--cyan); font-weight: 600;
    text-shadow: 0 0 10px rgba(94, 242, 255, .45);
  }
  #name { font-size: 18px; margin: 6px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #track {
    font-size: 13px; color: var(--accent); margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 200ms ease;
  }
  #track[hidden] { display: none; }
  #place { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* signal strength: how close the crosshair is to the station */
  #signal { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #signal .sig-label {
    flex: none; font-size: 10px; line-height: 1; letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted);
  }
  #meter { flex: 1; display: flex; gap: 4px; height: 6px; }
  #meter span { position: relative; flex: 1; background: rgba(255,255,255,.08); border-radius: 2px; }
  #meter span::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    opacity: 0; transition: opacity 150ms ease;
  }
  #meter span.on::after { opacity: 1; }

  /* power-on overlay — seen once, so it gets a real exit */
  #intro {
    position: fixed; inset: 0; display: grid; place-items: center;
    /* darker scrim + light blur so the station dots don't fight the text */
    background: radial-gradient(ellipse 420px 260px at center, rgba(2,3,10,.88), rgba(2,3,10,.5));
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    z-index: 10; text-align: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    transition: opacity 300ms var(--ease-out);

  #intro > div { transition: transform 300ms var(--ease-out); }
  #intro.leaving { opacity: 0; pointer-events: none; }
  #intro.leaving > div { transform: scale(0.97); }
  /* logo mark above the wordmark: 13×13 sprite at 6×, pixel-crisp */
  #intro .logo-globe {
    display: block; width: 78px; height: 78px; margin: 0 auto 18px;
    image-rendering: pixelated; image-rendering: crisp-edges;
    filter: drop-shadow(0 0 12px rgba(94, 242, 255, .35));
  }
  #intro h2 { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; color: var(--cyan);
    text-shadow: 0 0 16px rgba(94,242,255,.4); margin-bottom: 12px;
    -webkit-user-select: none; user-select: none; }
  #intro p { color: #c6d4e1; font-size: 14px; line-height: 1.7; max-width: 340px; margin: 0 auto 24px;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); text-wrap: balance; }
  #power {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; font-size: 14px; padding: 0 28px;
  }
  #power:disabled { cursor: wait; color: var(--muted); }
  /* 13×13 pixel globe drawn at 2×, kept crisp so it reads as 16-bit sprite art */
  #power .spin { width: 26px; height: 26px; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* loaded: the one primary action on screen, so it gets the filled cyan */
  #power.ready {
    background: var(--cyan); color: #02030a; border-color: var(--cyan);
    font-weight: 600; letter-spacing: .06em;
    box-shadow: 0 0 24px rgba(94, 242, 255, .35);
  }
  @media (hover: hover) and (pointer: fine) {
    #power.ready:hover { background: #8ff6ff; border-color: #8ff6ff; }
  }
  #power.ready:focus-visible { outline-color: var(--cyan); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    /* keep fades, drop movement */
    #intro > div, #intro.leaving > div { transition: none; transform: none; }
  }
</style>

    <button id="power" disabled><canvas class="spin" width="13" height="13" aria-hidden="true"></canvas><span class="label">Scanning frequencies…</span></button>
  </div>
</div>

<script src="https://unpkg.com/globe.gl@2"></script>
<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const flag = cc => cc && cc.length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '';

// Stations and the camera are compared as unit vectors: one dot product per
// station instead of a page of trig, which matters when it runs every frame.
const RAD = Math.PI / 180, DEG = 180 / Math.PI;
function vec(lat, lng) {
  const c = Math.cos(lat * RAD);
  return [c * Math.cos(lng * RAD), Math.sin(lat * RAD), c * Math.sin(lng * RAD)];
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const angleOf = d => Math.acos(Math.max(-1, Math.min(1, d))) * DEG;

// write a style only when the value actually changes
function setStyle(el, prop, v) {
  const cache = el._styles || (el._styles = {});
  if (cache[prop] === v) return;
  cache[prop] = v;
  el.style[prop] = v;
}

/* ---------- categories ----------
   A station gets the category of its first tag that matches (tags are roughly
   ordered by relevance), checked against this list in order. */
const CATS = [
  { id: 'electronic', label: 'Electronic', color: '#ff5edb', tags: ['electronic', 'techno', 'house'],
    re: /techno|electro|house|trance|ambient|minimal|drum ?(and|&|n) ?bass|dnb|edm|dance|club|breakbeat|dubstep|idm|synth|chill ?out|lounge|downtempo/i },
  { id: 'rock', label: 'Rock', color: '#ff8a3d', tags: ['rock', 'metal', 'indie'],
    re: /rock|metal|punk|grunge|indie|alternative|hardcore/i },
  { id: 'jazz', label: 'Jazz & Soul', color: '#ffd166', tags: ['jazz', 'blues', 'soul'],
    re: /jazz|blues|swing|soul|funk|motown|gospel/i },
  { id: 'classical', label: 'Classical', color: '#b69cff', tags: ['classical', 'opera'],
    re: /classical|klassik|opera|baroque|symphon|orchestr|chamber|piano/i },
  { id: 'hiphop', label: 'Hip-Hop & R&B', color: '#ff5e6c', tags: ['hiphop', 'rnb'],
    re: /hip ?-?hop|\brap\b|r ?& ?b|\brnb\b|urban|\btrap\b|grime/i },
  { id: 'world', label: 'World & Folk', color: '#3dffb0', tags: ['latin', 'folk', 'reggae', 'country'],
    re: /latin|reggae|world|folk|country|traditional|celtic|salsa|cumbia|bossa|samba|afro|bollywood|k-?pop|j-?pop|arab|turk|balkan|flamenco|tango|regional/i },
  { id: 'pop', label: 'Pop & Hits', color: '#b8ff5e', tags: ['pop', 'hits'],
    re: /pop|hits|top ?40|charts?|adult contemporary|\b(60|70|80|90)s\b|oldies|decades/i },
  { id: 'news', label: 'News & Talk', color: '#f4efe0', tags: ['news', 'talk'],
    re: /news|talk|sport|information|politic|public radio|spoken|comedy|educat/i },
];
const OTHER = { id: 'other', label: 'Other', color: '#5ef2ff', tags: [], re: null };
function classify(tags) {
  for (const t of tags) for (const c of CATS) if (c.re.test(t)) return c;
  return OTHER;
}

/* ---------- station data (Radio Browser API) ---------- */
const SERVERS = ['de1', 'de2', 'fi1', 'nl1', 'at1'];
async function api(query) {
  for (const s of SERVERS) {
    try {
      const r = await fetch(`https://${s}.api.radio-browser.info/json/stations/search?${query}`);
      if (r.ok) return await r.json();
    } catch (e) { /* try next server */ }
  }
  return [];
}

// Only keep stations whose audio format this browser can actually play
// (e.g. Safari can't play some Ogg/Opus streams that Chrome can).
const probe = document.createElement('audio');
const can = type => probe.canPlayType(type) !== '';
const CAN = {
  mp3: can('audio/mpeg'),
  aac: can('audio/aac') || can('audio/mp4; codecs="mp4a.40.2"'),
  opus: can('audio/ogg; codecs="opus"'),
  ogg: can('audio/ogg; codecs="vorbis"'),
  flac: can('audio/flac')
};
function playable(codec) {
  const c = (codec || '').toUpperCase();
  if (c.includes('MP3')) return CAN.mp3;
  if (c.includes('AAC')) return CAN.aac;
  if (c.includes('OPUS')) return CAN.opus;
  if (c.includes('OGG') || c.includes('VORBIS')) return CAN.ogg;
  if (c.includes('FLAC')) return CAN.flac;
  return true; // unknown codec: let it try
}

async function loadStations() {
  const base = 'has_geo_info=true&hidebroken=true&order=clickcount&reverse=true';
  const genreTags = CATS.flatMap(c => c.tags);
  const lists = await Promise.all([
    api(base + '&limit=3000'),
    ...genreTags.map(t => api(`${base}&tag=${encodeURIComponent(t)}&limit=400`))
  ]);

  const seen = new Map();
  for (const s of lists.flat()) {
    if (seen.has(s.stationuuid)) continue;
    const url = s.url_resolved || s.url || '';
    const lat = parseFloat(s.geo_lat), lng = parseFloat(s.geo_long);
    if (!url.startsWith('https://') || s.hls === 1 || /\.m3u8?(\?|$)|\.pls(\?|$)/i.test(url)) continue;
    if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) continue;
    if (!playable(s.codec)) continue;
    const name = (s.name || '').trim();
    if (!name) continue;
    const tags = (s.tags || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    seen.set(s.stationuuid, {
      name, url, lat, lng,
      country: s.country || '', state: s.state || '', cc: s.countrycode || '',
      tags, cat: classify(tags)
    });
  }

  // Many stations share a city's exact coordinates; fan them out in a small spiral
  // so each one can be tuned in separately.
  const stacks = new Map();
  const out = [...seen.values()];
  for (const st of out) {
    const key = st.lat.toFixed(2) + ',' + st.lng.toFixed(2);
    const n = stacks.get(key) || 0;
    stacks.set(key, n + 1);
    if (n > 0) {
      const a = n * 2.39996, rad = 0.3 * Math.sqrt(n);
      st.lat += rad * Math.sin(a);
      st.lng += rad * Math.cos(a) / Math.max(0.2, Math.cos(st.lat * Math.PI / 180));
    }
    st.v = vec(st.lat, st.lng);
  }
  return out;
}

/* ---------- globe ---------- */
// "low-power" asks dual-GPU laptops to stay on the integrated GPU
const globe = Globe({
  rendererConfig: { antialias: true, alpha: true, powerPreference: 'low-power' }
})($('globe'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .atmosphereColor('#3a9bff')
  .atmosphereAltitude(0.18)
  .pointLat('lat').pointLng('lng')
  .pointColor(d => d.cat.color)
  .pointAltitude(0.006)
  .pointRadius(0.16)
  .pointsMerge(true)
  .htmlLat('lat').htmlLng('lng').htmlAltitude(0.01)
  .htmlElement(d => d.el)
  // nothing on the globe is hoverable or clickable, so skip the per-frame raycasting
  .enablePointerInteraction(false);

// The library renders at up to 2× device pixels; on a phone that's ~4× the pixels
// of 1×. 1.5× is visually near-identical on a blurry night texture.
globe.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

// start over the Czech Republic
globe.pointOfView({ lat: 49.8, lng: 15.5, altitude: 1.8 });
const controls = globe.controls();
controls.minDistance = 120;
controls.maxDistance = 500;
controls.rotateSpeed = 0.6;

/* ---------- let the globe sleep when nothing moves ----------
   The 3D scene used to be redrawn 60–120 times a second forever, even with the
   globe sitting still. Now it renders while you drag, while it glides to a stop,
   while a fly-to or a fade is running, and then pauses. The last frame stays on
   screen; any touch wakes it before the controls see the event. */
let globeReady = false, globeAwake = true, dragging = false;
let sleepAt = 0, sleepTimer = 0;

function wakeGlobe(ms = 1200) {
  sleepAt = Math.max(sleepAt, performance.now() + ms);
  if (!globeAwake) { globeAwake = true; globe.resumeAnimation(); }
  if (globeReady && !sleepTimer) sleepTimer = setTimeout(trySleep, ms);
}
function trySleep() {
  sleepTimer = 0;
  const left = sleepAt - performance.now();
  if (left > 0) { sleepTimer = setTimeout(trySleep, left + 20); return; }
  if (dragging) { sleepTimer = setTimeout(trySleep, 500); return; }
  globeAwake = false;
  globe.pauseAnimation();
}

controls.addEventListener('start', () => { dragging = true; wakeGlobe(); });
controls.addEventListener('end', () => { dragging = false; wakeGlobe(); });
controls.addEventListener('change', () => wakeGlobe()); // includes the damping glide
const globeEl = $('globe');
globeEl.addEventListener('pointerdown', () => wakeGlobe(), { capture: true });
globeEl.addEventListener('wheel', () => wakeGlobe(), { capture: true, passive: true });

// don't pause before the textures have drawn, or the globe could stay black
globe.onGlobeReady(() => { globeReady = true; wakeGlobe(1500); });
setTimeout(() => { if (!globeReady) { globeReady = true; wakeGlobe(); } }, 10000);

addEventListener('resize', () => { globe.width(innerWidth).height(innerHeight); wakeGlobe(); });

const beacon = document.createElement('div');
beacon.className = 'beacon';
beacon.innerHTML = '<div class="b-inner"><span class="b-halo"></span><span class="b-dot"></span></div>';
const beaconInner = beacon.querySelector('.b-inner');
const beaconHalo = beacon.querySelector('.b-halo');

/* ---------- audio ----------
   Safari (and iOS) only let audio start from a tap or click. So instead of
   creating a new player per station, we keep two players and "unlock" both
   during the Switch-on click, then just swap their stream URL.
     corsEl  → routed through Web Audio, so the glow follows the music
     plainEl → for stations without CORS headers; plays directly, fake pulse */
const corsEl = new Audio();
corsEl.crossOrigin = 'anonymous';
const plainEl = new Audio();
for (const el of [corsEl, plainEl]) {
  el.preload = 'none';
  el.setAttribute('playsinline', '');
}

// a tenth of a second of silence, used to unlock the players
function silentWavUrl() {
  const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  let bin = '';
  new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  return 'data:audio/wav;base64,' + btoa(bin);
}

let ctx, master, noiseGain, musicGain, analyser, freq, wave;
let muted = false;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();

  // everything Web Audio plays goes through one master gain, so mute is one switch
  master = ctx.createGain();
  master.gain.value = muted ? 0 : 1;
  master.connect(ctx.destination);

  // looping white noise, band-passed to sound like AM/shortwave hiss
  const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.4;
  noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
  noise.connect(bp);
  bp.connect(noiseGain);
  noiseGain.connect(master);
  noise.start(0);

  // music: player → gain → master, and player → analyser (pre-gain, for the glow)
  musicGain = ctx.createGain(); musicGain.gain.value = 0;
  analyser = ctx.createAnalyser(); analyser.fftSize = 256;
  freq = new Uint8Array(analyser.frequencyBinCount);
  wave = new Uint8Array(analyser.fftSize);
  const src = ctx.createMediaElementSource(corsEl);
  src.connect(musicGain);
  src.connect(analyser);
  musicGain.connect(master);

  // unlock both players while we're still inside the click
  const blip = silentWavUrl();
  for (const el of [corsEl, plainEl]) { el.src = blip; el.play().catch(() => {}); }
  ctx.resume();
}

let activeEl = null, current = null, live = false, fake = false, silentSince = 0;

function clearEl(el) { el.pause(); el.removeAttribute('src'); el.load(); }
function stopAudio() { activeEl = null; live = false; clearEl(corsEl); clearEl(plainEl); }

// iOS ignores .volume on media elements, but does respect .muted
function setElVol(el, v) {
  el.muted = v < 0.03;
  try { el.volume = Math.min(1, Math.max(0, v)); } catch (e) {}
}

function start(el, url) {
  activeEl = el; live = false; silentSince = 0;
  el.src = url;
  el.play().catch(err => {
    if (activeEl === el && err && err.name === 'NotAllowedError') setStatus('Tap anywhere to play');
  });
}

for (const el of [corsEl, plainEl]) {
  el.addEventListener('playing', () => {
    if (activeEl !== el) return;
    live = true;
    setStatus('On Air', 'live');
    if (current && metaFor !== current) startMeta(current);
  });
  el.addEventListener('waiting', () => { if (activeEl === el) setStatus('Buffering', 'busy'); });
}
corsEl.addEventListener('error', () => { if (activeEl === corsEl && current) playWithoutCors(current); });
plainEl.addEventListener('error', () => {
  if (activeEl !== plainEl || !current) return;
  current.dead = true;
  scanKey = '';                  // re-pick the nearest station without this one
  stopAudio();
  setStatus('No signal');
});

function tune(st) {
  stopAudio();
  current = st; fake = false;
  setAccent(st.cat.color);
  stopMeta();
  setTrack(null);
  showStation(st);
  setStatus('Tuning', 'busy');
  globe.htmlElementsData([{ lat: st.lat, lng: st.lng, el: beacon }]);
  wakeGlobe(1300);               // let the globe place the beacon
  popBeacon();
  setElVol(plainEl, 0);
  corsEl.muted = false;
  start(corsEl, st.url); // try with CORS first so the glow can follow the music
}

// Stations without CORS headers (or where Safari's Web Audio hears silence)
// still play directly, just with a fake pulse for the glow.
function playWithoutCors(st) {
  activeEl = null;
  clearEl(corsEl);
  fake = true;
  setElVol(plainEl, 0);
  start(plainEl, st.url);
}

// Safari suspends audio when a tab is hidden or a call comes in; wake it back up.
function wake() {
  if (!ctx) return;
  if (ctx.state !== 'running') ctx.resume();
  if (activeEl && activeEl.paused && current) activeEl.play().catch(() => {});
}
document.addEventListener('pointerdown', wake);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  wake();
  if (metaFor) pollMeta(metaFor); // catch up on the song after coming back to the tab
});

function dropStation() {
  stopAudio();
  current = null;
  globe.htmlElementsData([]);
  wakeGlobe();
  stopMeta();
  setTrack(null);
  setAccent(OTHER.color);
  setStatus('Searching the airwaves');
  $('name').textContent = '—';
  $('place').textContent = 'Drag the globe to tune';
}

/* ---------- mute ---------- */
function setMuted(v) {
  muted = v;
  const b = $('mute');
  b.classList.toggle('active', v);
  b.setAttribute('aria-pressed', String(v));
  b.querySelector('.label').textContent = v ? 'Unmute' : 'Mute';
  if (master) master.gain.setTargetAtTime(v ? 0 : 1, ctx.currentTime, 0.015);
  if (fake && v) setElVol(plainEl, 0); // direct-play stations bypass Web Audio
  renderStatus();
}
$('mute').onclick = () => setMuted(!muted);
addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'm' || e.key === 'M') setMuted(!muted);
});

/* ---------- now playing (via the Cloudflare Worker) ----------
   Paste your deployed Worker URL here. Left empty, the app works as before,
   just without song titles. */
const META_URL = 'https://terra-dial-meta.mentiondesign.workers.dev';
const META_EVERY = 20000;      // ms between checks while a station is on air
let metaTimer = null, metaFor = null;

function startMeta(st) {
  stopMeta();
  if (!META_URL) return;
  metaFor = st;
  pollMeta(st);
  metaTimer = setInterval(() => pollMeta(st), META_EVERY);
}
function stopMeta() { clearInterval(metaTimer); metaTimer = null; metaFor = null; }

async function pollMeta(st) {
  if (document.hidden) return;   // no lookups for a background tab
  try {
    const r = await fetch(`${META_URL}?url=${encodeURIComponent(st.url)}`);
    if (!r.ok) return;
    const j = await r.json();
    if (current !== st) return;  // tuned away while we waited
    setTrack(cleanTrack(j, st));
  } catch (e) { /* keep whatever we showed last */ }
}

// Many stations send their own name, a URL or placeholder text instead of a song.
function cleanTrack(j, st) {
  const t = (j && j.title || '').trim();
  if (t.length < 3) return null;
  const low = t.toLowerCase();
  if (low === st.name.toLowerCase() || st.name.toLowerCase().includes(low)) return null;
  if (/https?:|www\.|\.(com|net|org|fm)\b/i.test(t)) return null;
  if (/^(unknown|n\/a|-+|untitled|advert|commercial)/i.test(t)) return null;
  return j.artist ? `${j.song} — ${j.artist}` : t;
}

function setTrack(text) {
  const el = $('track');
  const next = text || '';
  if (el.dataset.t === next) return;
  el.dataset.t = next;
  el.textContent = next ? `♪ ${next}` : '';
  el.hidden = !next;
  if (next) morph(el);
}

/* ---------- UI ---------- */
let statusText = 'Searching the airwaves';
let statusKind = '';             // '' | 'busy' (connecting) | 'live' (on air)
function setStatus(t, kind = '') {
  const becameLive = kind === 'live' && statusKind !== 'live';
  statusText = t; statusKind = kind;
  renderStatus();
  if (becameLive) morph($('status').querySelector('.s-main')); // small confirm beat
}
function renderStatus() {
  const el = $('status');
  el.dataset.kind = statusKind;
  el.textContent = '';
  const main = document.createElement('span');
  main.className = 's-main';
  main.textContent = statusText;
  el.append(main);
  if (statusKind === 'busy') {
    el.insertAdjacentHTML('beforeend', '<span class="s-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>');
  }
  if (muted) el.append(' · Muted');
}

// set only when the tuned station changes, never per frame
function setAccent(color) { document.documentElement.style.setProperty('--accent', color); }

// tiny blur crossfade so the station name doesn't hard-swap
function morph(el) {
  if (!el.animate) return;
  el.animate(
    RM.matches
      ? [{ opacity: 0.4 }, { opacity: 1 }]
      : [{ opacity: 0.4, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0px)' }],
    { duration: 180, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
  );
}

function popBeacon() {
  if (!beaconInner.animate) return;
  beaconInner.animate(
    RM.matches
      ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: 'scale(0.9)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 200, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
  );
}

function showStation(st) {
  $('name').textContent = st.name;
  const where = [st.state, st.country].filter(Boolean).join(', ');
  const tags = st.tags.slice(0, 3).join(' · ');
  $('place').textContent = `${flag(st.cc)} ${where}  —  ${st.cat.label}${tags ? ' · ' + tags : ''}`;
  morph($('name'));
}
const meterEl = $('meter');
const bars = [...meterEl.querySelectorAll('span')];

let stations = [], active = [], mode = 'all';

// genre menu order: All, then the big four, then the rest
const MENU_ORDER = ['pop', 'electronic', 'rock', 'hiphop', 'jazz', 'classical', 'world', 'news', 'other'];
const ALL_ITEM = { id: 'all', label: 'All stations', color: '#5ef2ff' };
const CHECK_SVG = '<svg class="check" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 6.3 2.3 2.2 4.7-5"/></svg>';
const genreBtn = $('genreBtn'), genreMenu = $('genreMenu');
let menuItems = [];

function buildMenu() {
  const counts = new Map();
  for (const s of stations) counts.set(s.cat.id, (counts.get(s.cat.id) || 0) + 1);
  const cats = MENU_ORDER
    .map(id => id === 'other' ? OTHER : CATS.find(c => c.id === id))
    .filter(c => c && counts.get(c.id));

  genreMenu.textContent = '';
  const add = (it, n) => {
    const b = document.createElement('button');
    b.className = 'item';
    b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', 'false');
    b.tabIndex = -1;
    b.dataset.mode = it.id;
    b.style.setProperty('--c', it.color);
    const dot = document.createElement('i'); dot.className = 'dot';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = it.label;
    const count = document.createElement('small'); count.textContent = n.toLocaleString();
    b.append(dot, name, count);
    b.insertAdjacentHTML('beforeend', CHECK_SVG);
    b.onclick = () => { setMode(it.id); closeMenu(true); };
    genreMenu.appendChild(b);
  };
  add(ALL_ITEM, stations.length);
  genreMenu.appendChild(document.createElement('hr'));
  for (const c of cats) add(c, counts.get(c.id));
  menuItems = [...genreMenu.querySelectorAll('.item')];
}

function placeMenu() {
  const r = genreBtn.getBoundingClientRect();
  const w = genreMenu.offsetWidth;
  const gutter = 16;
  const left = Math.min(Math.max(gutter, r.left), innerWidth - w - gutter);
  const top = r.bottom + 6;
  genreMenu.style.left = left + 'px';
  genreMenu.style.top = top + 'px';
  genreMenu.style.setProperty('--menu-top', top + 'px');
  // grow out of the trigger, not out of the menu's own corner
  genreMenu.style.setProperty('--origin', `${r.left + r.width / 2 - left}px -6px`);
}

function openMenu(fromKeyboard) {
  placeMenu();
  genreMenu.classList.toggle('instant', !!fromKeyboard || RM.matches);
  genreMenu.classList.add('open');
  genreBtn.setAttribute('aria-expanded', 'true');
  const sel = menuItems.find(b => b.dataset.mode === mode) || menuItems[0];
  if (sel) sel.focus({ preventScroll: true });
}

function closeMenu(returnFocus) {
  if (!genreMenu.classList.contains('open')) return;
  genreMenu.classList.remove('open');
  genreBtn.setAttribute('aria-expanded', 'false');
  if (returnFocus) genreBtn.focus({ preventScroll: true });
}

// e.detail === 0 means the click came from Enter/Space, not a pointer
genreBtn.addEventListener('click', e => {
  genreMenu.classList.contains('open') ? closeMenu(false) : openMenu(e.detail === 0);
});
genreBtn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); openMenu(true); }
});
genreMenu.addEventListener('keydown', e => {
  const i = menuItems.indexOf(document.activeElement);
  const go = n => menuItems[(n + menuItems.length) % menuItems.length].focus();
  if (e.key === 'ArrowDown') { e.preventDefault(); go(i + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); go(i - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(-1); }
  else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
  else if (e.key === 'Tab') closeMenu(false);
});
// tap or drag anywhere else (including the globe) closes it
document.addEventListener('pointerdown', e => {
  if (!genreMenu.contains(e.target) && !genreBtn.contains(e.target)) closeMenu(false);
});
addEventListener('resize', () => closeMenu(false));

function setMode(m) {
  mode = m;
  active = m === 'all' ? stations : stations.filter(s => s.cat.id === m);
  globe.pointsData(active);
  wakeGlobe(1500);               // points fade between genres
  scanKey = '';
  const it = m === 'all' ? ALL_ITEM : (m === 'other' ? OTHER : CATS.find(c => c.id === m));
  genreBtn.style.setProperty('--c', it.color);
  genreBtn.querySelector('.label').textContent = m === 'all' ? 'All' : it.label;
  genreBtn.classList.toggle('active', m !== 'all');
  for (const b of menuItems) b.setAttribute('aria-checked', String(b.dataset.mode === m));
  if (current && !active.includes(current)) dropStation();
}

$('random').onclick = () => {
  const pool = active.filter(s => !s.dead);
  if (!pool.length) return;
  const s = pool[Math.floor(Math.random() * pool.length)];
  const ms = RM.matches ? 0 : 1600;
  wakeGlobe(ms + 600);
  globe.pointOfView({ lat: s.lat, lng: s.lng, altitude: 1.0 }, ms);
};

/* ---------- static canvas ----------
   White pixels with random alpha (see the #static CSS). The colour channels are
   set once; each redraw only rewrites alpha. */
const sc = $('static'), sx = sc.getContext('2d');
sc.width = 200; sc.height = 120;
const img = sx.createImageData(sc.width, sc.height);
img.data.fill(255);
function drawStatic() {
  const d = img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = Math.random() * 255 | 0;
  sx.putImageData(img, 0, 0);
}

/* ---------- main loop: the crosshair is the tuning needle ---------- */
let on = false, pending = null, pendingSince = 0;
let lastFrame = 0, lastStatic = 0, lastLit = -1;
let glow = 0;                    // smoothed beat level that drives the crosshair pulse
let scanKey = '', nearest = null, nearestDist = Infinity, camV = null;
const cross = $('cross');
const crossHalo = cross.querySelector('.halo');

function frame(t) {
  requestAnimationFrame(frame);
  if (!on) return;
  // 120 Hz screens don't need the tuning logic twice as often; ~60 fps is plenty
  if (t - lastFrame < 14) return;
  const dt = Math.min(100, t - lastFrame); // ms since the last processed frame
  lastFrame = t;

  const pov = globe.pointOfView();
  const capture = 1.2 + pov.altitude * 2.2; // degrees; wider when zoomed out

  // only search for the nearest station when the camera has actually moved
  const key = pov.lat.toFixed(4) + ',' + pov.lng.toFixed(4) + ',' + pov.altitude.toFixed(3);
  if (key !== scanKey) {
    scanKey = key;
    camV = vec(pov.lat, pov.lng);
    let bestDot = -2;
    nearest = null;
    for (const s of active) {
      if (s.dead) continue;
      const d = dot(s.v, camV);
      if (d > bestDot) { bestDot = d; nearest = s; }
    }
    nearestDist = nearest ? angleOf(bestDot) : Infinity;
  }

  // stick with the current station until you've clearly moved off it
  let target = nearest && nearestDist < capture ? nearest : null;
  let dist = nearestDist;
  if (current && !current.dead) {
    const cd = angleOf(dot(current.v, camV));
    if (cd < capture * 0.7) { target = current; dist = cd; }
  }
  let strength = target ? 1 - dist / capture : 0;
  strength = strength * strength * (3 - 2 * strength); // smoothstep

  // short debounce so fast spinning doesn't load every stream it passes
  if (target !== current) {
    if (target !== pending) { pending = target; pendingSince = t; }
    else if (t - pendingSince > 350) {
      pending = null;
      target ? tune(target) : dropStation();
    }
  } else pending = null;

  // mix static and music (master gain handles mute for the Web Audio path)
  const mg = live && target === current ? Math.pow(strength, 0.8) : 0;
  const now = ctx.currentTime;
  if (fake) setElVol(plainEl, muted ? 0 : mg);
  else musicGain.gain.setTargetAtTime(mg, now, 0.08);
  noiseGain.gain.setTargetAtTime(0.015 + 0.16 * (1 - mg), now, 0.08);

  // visual static: ~20 redraws a second (it reads as the same flicker), slower
  // with reduced motion, and none at all once a station is clearly tuned in
  const staticOpacity = 0.04 + 0.3 * (1 - mg);
  if (staticOpacity > 0.06 && t - lastStatic > (RM.matches ? 150 : 50)) {
    lastStatic = t;
    drawStatic();
  }
  setStyle(sc, 'opacity', staticOpacity.toFixed(2));

  // beat level for the glow
  let level = 0;
  if (live) {
    if (!fake) {
      analyser.getByteFrequencyData(freq);
      let sum = 0;
      for (let i = 1; i < 8; i++) sum += freq[i];
      level = Math.max(0, (sum / 7 / 255 - 0.35) / 0.65);

      // Safari sometimes hands Web Audio pure silence for live streams. If the
      // player says it's playing but nothing comes through for 2.5 s, switch
      // that station to direct playback.
      analyser.getByteTimeDomainData(wave);
      let quiet = true;
      for (let i = 0; i < wave.length; i += 4) {
        if (Math.abs(wave[i] - 128) > 1) { quiet = false; break; }
      }
      if (!quiet) silentSince = 0;
      else if (!silentSince) silentSince = t;
      else if (t - silentSince > 2500 && current) playWithoutCors(current);
    } else {
      level = 0.35 + 0.35 * Math.sin(t / 1000 * Math.PI * 2 * 0.5); // slow breath, one every 2 s
    }
  }

  // Smooth the raw level so the pulse swells and settles instead of flickering
  // with every drum hit: rises over ~0.25 s, eases back down over ~0.9 s.
  // Frame-rate independent, so 60 Hz and 120 Hz screens feel the same.
  const tau = level > glow ? 250 : 900;
  glow += (level - glow) * (1 - Math.exp(-dt / tau));

  // glow: opacity + transform only, so it stays on the compositor
  const g = glow * mg;
  setStyle(crossHalo, 'opacity', (0.15 + g * 0.85).toFixed(2));
  setStyle(cross, 'transform', RM.matches ? '' : `scale(${(1 + g * 0.18).toFixed(3)})`);
  setStyle(beaconHalo, 'opacity', (0.45 + g * 0.55).toFixed(2));

  // signal meter
  const lit = target ? Math.round(strength * bars.length) : 0;
  if (lit !== lastLit) {
    lastLit = lit;
    bars.forEach((b, i) => b.classList.toggle('on', i < lit));
    meterEl.setAttribute('aria-valuenow', lit);
  }
}
requestAnimationFrame(frame);

/* ---------- loading globe: a 13×13 pixel sprite ----------
   Each frame works out, per pixel, where it sits on a sphere and lights it if
   it lands on a meridian or parallel. It steps at 10 fps on purpose: the
   choppy turn is what makes it read as 16-bit. */
function drawGlobeSprite(c, phase) {
  const N = 13, R = N / 2;
  c.clearRect(0, 0, N, N);
  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
    const x = (px + 0.5 - R) / R, y = (py + 0.5 - R) / R, r2 = x * x + y * y;
    if (r2 > 1) continue;
    let lit = r2 > 0.8;                                   // outline
    if (!lit) {
      const z = Math.sqrt(1 - r2);
      const lat = Math.asin(-y) * DEG;
      const lon = Math.atan2(x, z) * DEG + phase;
      const m = ((lon % 60) + 60) % 60;
      lit = Math.min(m, 60 - m) < 9                       // meridians every 60°
        || Math.abs(lat) < 6 || Math.abs(Math.abs(lat) - 45) < 6; // equator + 45°N/S
    }
    c.fillStyle = lit ? '#5ef2ff' : 'rgba(94, 242, 255, 0.16)';
    c.fillRect(px, py, 1, 1);
  }
}
// the intro logo: the same sprite, frozen front-on like the favicon and logo files
drawGlobeSprite($('intro').querySelector('.logo-globe').getContext('2d'), 0);

const spinCanvas = $('power').querySelector('.spin');
const spinCtx = spinCanvas.getContext('2d');
let spinPhase = 0, spinTimer = 0;
const drawSpin = () => drawGlobeSprite(spinCtx, spinPhase);
drawSpin();
if (!RM.matches) spinTimer = setInterval(() => { spinPhase = (spinPhase + 10) % 360; drawSpin(); }, 100);
function stopSpin() { clearInterval(spinTimer); spinCanvas.remove(); }

/* ---------- boot ---------- */
loadStations().then(list => {
  stations = list;
  buildMenu();
  setMode('all');
  const btn = $('power');
  stopSpin();
  const label = btn.querySelector('.label');
  if (!list.length) { label.textContent = 'Could not reach the station list'; return; }
  label.textContent = `Tune in · ${list.length.toLocaleString()} stations`;
  btn.classList.add('ready');
  btn.disabled = false;
  btn.onclick = () => {
    initAudio();
    on = true;
    const intro = $('intro');
    intro.classList.add('leaving');
    const done = () => intro.remove();
    intro.addEventListener('transitionend', e => { if (e.target === intro) done(); });
    setTimeout(done, 400); // fallback if the transition is skipped
  };
});
</script>
</body>
</html>
